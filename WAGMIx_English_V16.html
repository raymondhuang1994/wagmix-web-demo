/* Regional access presentation. Real access control belongs to the server/edge. */
body.geo-access-blocked{overflow:hidden!important}
body.geo-access-blocked #app{pointer-events:none;user-select:none}
.geo-overlay{position:fixed;inset:0;z-index:10000;display:flex;align-items:center;justify-content:center;padding:24px;background:rgba(3,12,25,.82);backdrop-filter:blur(8px);overflow:auto;overscroll-behavior:contain}
.geo-dialog{box-sizing:border-box;width:min(560px,100%);max-height:calc(100dvh - 48px);overflow:auto;padding:30px 34px 26px;border:1px solid #334759;border-radius:24px;background:radial-gradient(ellipse at top right,rgba(38,109,190,.17),transparent 50%),#101d2d;color:#f6f9fc;box-shadow:0 30px 90px #0008;text-align:center;font-family:Arial,"PingFang HK","Noto Sans TC",sans-serif}
.geo-dialog-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:26px}
.geo-logo{width:132px;height:34px;object-fit:contain;object-position:left}
.geo-language{border:1px solid #50647a;border-radius:8px;padding:7px 11px;font-size:12px;color:#dceafe;text-decoration:none;line-height:1}
.geo-warning{display:grid;place-items:center;width:66px;height:66px;margin:0 auto 22px;border:1px solid #7098c1;border-radius:50%;background:#173d65;color:#a2d4ff;font:bold 42px/1 Arial}
.geo-warning.is-checking{animation:geo-pulse 1.2s ease-in-out infinite}
.geo-dialog h2{margin:0 0 17px;color:#fff;font-size:25px;line-height:1.25;letter-spacing:-.4px}
.geo-dialog h2:focus{outline:none}
.geo-dialog p{margin:0;color:#d0dcea;font-size:15px;line-height:1.75;text-wrap:pretty}
.geo-actions{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:28px}
.geo-actions a,.geo-actions button{box-sizing:border-box;display:flex;align-items:center;justify-content:center;gap:12px;min-height:46px;padding:11px 15px;border-radius:10px;font:600 14px/1.4 Arial,"PingFang HK",sans-serif;text-decoration:none;cursor:pointer}
.geo-primary{background:#2c77df;color:#fff;border:1px solid #3c8af5}
.geo-primary:hover{background:#3989f5}
.geo-secondary{background:#ffffff08;color:#e9f1fc;border:1px solid #50647a}
.geo-secondary:hover{background:#ffffff14}
.geo-secondary:disabled{opacity:.5;cursor:wait}
.geo-contact-links{display:flex;justify-content:center;align-items:center;gap:11px;flex-wrap:wrap;margin-top:20px;color:#60788e;font:12px/1.5 Arial,sans-serif}
.geo-contact-links a{color:#c0d4e8;text-decoration:none}
.geo-contact-links a:hover{text-decoration:underline}
.geo-preview{font:11px/1.4 Arial,"PingFang HK",sans-serif;box-sizing:border-box}
.geo-preview-label{display:flex;align-items:center;gap:7px;letter-spacing:.15px}
.geo-preview-label i{display:block;width:6px;height:6px;flex-shrink:0;border-radius:100%;background:#4b8bc9}
.geo-preview-options{display:flex;gap:4px;margin-top:8px}
.geo-preview-options button{appearance:none;border:1px solid transparent;border-radius:5px;padding:5px 9px;background:transparent;color:inherit;font:inherit;line-height:1.4;cursor:pointer;white-space:nowrap}
.geo-preview-options button[aria-pressed="true"]{background:#2c77df20;border-color:#559ce766;color:inherit;font-weight:700}
.geo-preview-options button:hover{background:#2c77df18}
.geo-preview-floating{position:fixed;left:18px;bottom:16px;z-index:9000;padding:10px 12px;border:1px solid #c7d9e7;border-radius:12px;background:rgba(250,253,255,.96);color:#36556f;box-shadow:0 3px 16px #0b274515;backdrop-filter:blur(8px);max-width:calc(100vw - 36px)}
.geo-preview-in-dialog{margin-top:24px;border-top:1px solid #314256;padding-top:17px;text-align:left;color:#8fa8bf}
.geo-preview-in-dialog .geo-preview-options{justify-content:space-between}
.geo-dialog a:focus-visible,.geo-dialog button:focus-visible,.geo-preview-floating button:focus-visible{outline:3px solid #97d1ff;outline-offset:3px}
@keyframes geo-pulse{50%{opacity:.45}}
@media(max-width:540px){.geo-overlay{padding:14px}.geo-dialog{padding:23px 22px 20px;border-radius:19px;max-height:calc(100dvh - 28px)}.geo-dialog-top{margin-bottom:22px}.geo-logo{width:118px;height:30px}.geo-dialog h2{font-size:22px}.geo-dialog p{font-size:14px;line-height:1.7}.geo-warning{width:56px;height:56px;font-size:36px;margin-bottom:19px}.geo-preview-floating{left:10px;bottom:10px;padding:8px 10px;max-width:calc(100vw - 20px)}.geo-preview-options button{padding:5px 7px}.geo-contact-links{gap:9px}.geo-actions{margin-top:23px}}
@media(max-width:350px){.geo-dialog{padding:20px 17px}.geo-actions{grid-template-columns:1fr}.geo-preview-in-dialog .geo-preview-options{flex-wrap:wrap;justify-content:flex-start}}
@media(prefers-reduced-motion:reduce){.geo-warning.is-checking{animation:none}}

/* Shared reading system. Both languages use the same semantic type scale. */
:root {
  --reading-body: 17px;
  --reading-ui: 15px;
  --reading-note: 14px;
  --reading-caption: 13px;
  --reading-section: 34px;
  --reading-card: 24px;
  --reading-muted: #4b657d;
  --reading-dark-muted: #b3c7de;
}
body { font-size: var(--reading-body); line-height: 1.75; }
button, input, select, textarea { font-family: var(--font); }
.eyebrow, .pill, .docs-kicker, .adgm-kicker { font-size: var(--reading-caption); line-height: 1.6; }
.btn, .text-link, .adgm-button, .p-trading-pending,
.p-factsheet-link, .catalog-open { font-size: var(--reading-ui); line-height: 1.6; min-height: 46px; }
.btn, .adgm-button { white-space: normal; }
.site-nav, .site-nav > a, .site-nav summary,
.header-contact, .lang-switch { font-size: var(--reading-ui); }
.site-nav > a, .site-nav summary { padding-inline: 16px; }
.site-nav .product-menu-panel { max-width: calc(100vw - 40px); }
.menu-underlying-code { font-size: 16px; }
.menu-underlying-name { font-size: 17px; line-height: 1.6; }

/* Page navigation stays readable rather than shrinking in the English edition. */
.context-layout, .whitepaper-layout {
  grid-template-columns: 260px minmax(0, 1fr);

function priceChart(mode='line'){
 const rows=HISTORY.prices,W=1080,H=350,left=10,right=70,top=28,bottom=44,lo=10,hi=50,plotH=H-top-bottom,plotW=W-left-right;
 const d0=Date.parse(rows[0].date),d1=Date.parse(rows.at(-1).date),x=d=>left+(Date.parse(d)-d0)/(d1-d0)*plotW,y=v=>top+(hi-v)/(hi-lo)*plotH;
 const path=rows.map((p,i)=>`${i?'L':'M'}${x(p.date).toFixed(1)},${y(p.close).toFixed(1)}`).join(' '),last=rows.at(-1);
 const grid=[10,20,30,40,50].map(v=>`<line x1="${left}" y1="${y(v)}" x2="${W-right}" y2="${y(v)}" stroke="#dfe8f3" stroke-dasharray="3 5"/><text x="${W-right+17}" y="${y(v)+4}" fill="#7890ac" font-size="16">${v.toFixed(2)}</text>`).join('');
 const ticks=[rows[0],rows[4],rows[9],rows[14],last].map((r,i)=>`<text x="${x(r.date)}" y="${H-12}" fill="#7890ac" font-size="16" text-anchor="${i===0?'start':i===4?'end':'middle'}">${r.date.slice(5).replace('-','/')}</text>`).join('');
 const points=rows.map(p=>`<circle class="chart-point" cx="${x(p.date)}" cy="${y(p.close)}" r="3.4" fill="#1678ed"><title>${p.date} · ${t('港元','HKD')} ${p.close.toFixed(3)}</title></circle>`).join('');
 const candle=rows.map(p=>{const color=p.close>=p.open?'#009a85':'#e16c77';return `<g><title>${p.date} · ${t('開市','O')} ${p.open} ${t('最高','H')} ${p.high} ${t('最低','L')} ${p.low} ${t('收市','C')} ${p.close}</title><line x1="${x(p.date)}" x2="${x(p.date)}" y1="${y(p.high)}" y2="${y(p.low)}" stroke="${color}" stroke-width="1.4"/><rect x="${x(p.date)-7}" y="${Math.min(y(p.open),y(p.close))}" width="14" height="${Math.max(2,Math.abs(y(p.open)-y(p.close)))}" rx="1" fill="${color}"/></g>`;}).join('');
 return `<svg class="p-price-chart-svg" viewBox="0 0 ${W} ${H}" role="img" aria-label="${t('7709.HK 歷史價格：2026年9月30日至10月28日，已取得的19個交易日，港元。','7709.HK historical prices: 19 available trading days from 30 September to 28 October 2026, in HKD.')}"><defs><linearGradient id="chart-fill" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#1688ee" stop-opacity=".22"/><stop offset="1" stop-color="#1688ee" stop-opacity=".01"/></linearGradient></defs>${grid}${mode==='line'?`<path d="${path} L${x(last.date)},${y(lo)} L${left},${y(lo)} Z" fill="url(#chart-fill)"/><path d="${path}" fill="none" stroke="#1678ed" stroke-width="3" stroke-linejoin="round"/>${points}`:candle}${ticks}<line x1="${left}" x2="${W-right}" y1="${y(last.close)}" y2="${y(last.close)}" stroke="#1688ee" stroke-opacity=".3" stroke-dasharray="4 4"/><rect x="${W-right+8}" y="${y(last.close)-12}" width="53" height="24" rx="5" fill="#1678ed"/><text x="${W-right+34}" y="${y(last.close)+4}" fill="white" font-size="16" text-anchor="middle">${last.close.toFixed(2)}</text></svg>`;
}

function adgmProduct() {
  const market = productMarket().replaceAll('product-market', 'adgm-market').replaceAll('SKHY2Lw', '7709.W');
  // 7709.W has no T0 note in its overview, so its local source notes begin at 1.
  const theme = productTheme().replaceAll('product-theme', 'adgm-theme').replace(/[²³⁴]/g, ref => ({'²':'¹','³':'²','⁴':'³'}[ref]));

function docsSearchRecords(query){
 const q=query.trim().toLocaleLowerCase(),words=q.split(/\s+/).filter(Boolean);if(!words.length)return [];
 const out=[];
 for(const c of WHITEPAPER){for(const s of c.sections){
  const clauseFields=[s.ref==='B.7'?'2026 年 11 月 20 日 20 November 2026 2026.11.20':'',s.ref,s.field,s.fieldZh||'',s.lead?.zh||'',s.lead?.en||'',s.content,s.contentZh||''];
  const clauseText=clauseFields.join(' ').toLocaleLowerCase();
  const clauseHits=words.filter(w=>clauseText.includes(w)).length;
  const candidates=[...clauseFields,c.title.zh,c.title.en,c.summary.zh,c.summary.en];
  const hay=candidates.join(' ').toLocaleLowerCase();if(!words.every(w=>hay.includes(w)))continue;
  const preferred=L==='zh'?[s.contentZh||'',s.lead?.zh||'',s.fieldZh||'',c.summary.zh]:[s.content,s.lead?.en||'',s.field,c.summary.en,s.contentZh||'',s.lead?.zh||'',c.summary.zh];
  const body=preferred.find(x=>x&&words.some(w=>x.toLocaleLowerCase().includes(w)))||preferred.find(Boolean)||'';
  let at=body.toLocaleLowerCase().indexOf(words[0]);if(at<0)at=0;
  const start=Math.max(0,at-54),end=Math.min(body.length,start+205),snippet=(start?'…':'')+body.slice(start,end).replace(/\s+/g,' ')+(end<body.length?'…':'');
  out.push({clauseHits,record:{chapter:c,id:s.ref.replaceAll('.','-'),ref:s.ref,title:clauseLead(s),snippet}});
 }}return out.sort((a,b)=>b.clauseHits-a.clauseHits).map(item=>item.record);
}
function docsMark(text,query){const words=query.trim().split(/\s+/).filter(Boolean).sort((a,b)=>b.length-a.length);if(!words.length)return esc(text);const pattern=words.map(x=>x.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')).join('|');const re=new RegExp(`(${pattern})`,'gi');return String(text).split(re).map((p,i)=>i%2?`<mark>${esc(p)}</mark>`:esc(p)).join('');}
function closeDocsSearch(){document.querySelectorAll('[data-docs-search]').forEach(x=>x.setAttribute('aria-expanded','false'));document.querySelectorAll('.docs-search-results').forEach(x=>x.hidden=true);}
function handleDocsInput(e){if(!e.target.matches('[data-docs-search]'))return;const input=e.target,wrap=input.closest('.docs-search-wrap'),box=wrap.querySelector('.docs-search-results'),query=input.value.trim();if(!query){box.hidden=true;input.setAttribute('aria-expanded','false');return;}const results=docsSearchRecords(query);box.innerHTML=`<div class="docs-result-count">${results.length} ${t('項相關條款','matching entries')}<button type="button" data-docs-close aria-label="${t('關閉搜尋結果','Close search results')}">×</button></div>${results.length?results.slice(0,15).map((r,i)=>`<a role="option" aria-selected="false" class="docs-search-result" id="docs-result-${i}" href="#/whitepaper/${r.chapter.id}/${r.id}"><span>${esc(chapterNames[r.chapter.id])} <b>${esc(displayClauseRef(r.ref))}</b></span><strong>${docsMark(r.title,query)}</strong><p>${docsMark(r.snippet,query)}</p></a>`).join(''):`<div class="docs-no-results"><strong>${t('未找到相關內容','No matching content')}</strong><p>${t('可嘗試「費用」「贖回」「風險」或英文關鍵字。','Try “fees”, “redemption”, “risk” or a clause reference.')}</p></div>`}${results.length>15?`<div class="docs-result-more">${t('顯示前 15 項；加入關鍵字可縮小搜尋範圍。','Showing the first 15 entries. Add keywords to narrow your search.')}</div>`:''}`;box.hidden=false;input.setAttribute('aria-expanded','true');input.removeAttribute('aria-activedescendant');}
function handleDocsClick(e){if(e.target.closest('[data-docs-close]')){closeDocsSearch();return;}if(e.target.closest('.docs-search-result')){closeDocsSearch();return;}if(!e.target.closest('.docs-search-wrap'))closeDocsSearch();if(e.target.matches('[data-docs-search]')&&e.target.value.trim())handleDocsInput(e);}
function handleDocsKeydown(e){if(e.key==='Escape'){closeDocsSearch();return;}if(!e.target.matches('[data-docs-search]'))return;const box=e.target.closest('.docs-search-wrap').querySelector('.docs-search-results');if(box.hidden)return;const links=[...box.querySelectorAll('.docs-search-result')];if(!links.length)return;const current=links.findIndex(a=>a.getAttribute('aria-selected')==='true');if(e.key==='ArrowDown'||e.key==='ArrowUp'){e.preventDefault();const i=e.key==='ArrowDown'?(current+1)%links.length:(current<=0?links.length-1:current-1);links.forEach((a,j)=>a.setAttribute('aria-selected',j===i?'true':'false'));e.target.setAttribute('aria-activedescendant',links[i].id);links[i].scrollIntoView({block:'nearest'});}else if(e.key==='Enter'){e.preventDefault();const chosen=links[Math.max(0,current)];location.hash=chosen.getAttribute('href').slice(1);closeDocsSearch();}}

function updateV9EcosystemDirectory() {
  const page = document.querySelector('.eco-v9-page');
  if (!page) return;
  const values = Object.fromEntries([...page.querySelectorAll('[data-eco-v9-field]')].map(field=>[field.dataset.ecoV9Field,field.value]));
  const terms = (page.querySelector('[data-eco-v9-search]').value || '').trim().toLocaleLowerCase().split(/\s+/).filter(Boolean);
  let count = 0;
  page.querySelectorAll('[data-eco-v9-card]').forEach(card=>{
    const entry = v9EcoInstitutions.find(item=>item.id===card.dataset.ecoV9Card);
    const related = entry.relations.some(relation=>Object.entries(values).every(([key,value])=>value==='all'||relation[key]===value));
    const searchable = `${entry.name} ${entry.legal} ${entry.intro.zh} ${entry.intro.en}`.toLocaleLowerCase();
    const visible = related && terms.every(term=>searchable.includes(term));
    card.hidden = !visible;
    card.classList.remove('is-open', 'is-dismissed');
    card.classList.toggle('eco-v9-at-right', visible && count % 2 === 1);
    card.querySelector('[data-eco-v9-toggle]').setAttribute('aria-expanded','false');
    if (visible) count++;
  });
  page.querySelector('[data-eco-v9-results]').textContent = t(`共 ${count} 項`, count === 1 ? '1 result' : `${count} results`);
  page.querySelector('[data-eco-v9-empty]').hidden = count > 0;
}
function handleEcosystemInput(event) {
  if (event.target.matches('[data-eco-v9-search],[data-eco-v9-field]')) updateV9EcosystemDirectory();
}
function handleEcosystemClick(event) {
  const reset = event.target.closest('[data-eco-v9-reset]');
  const toggle = event.target.closest('[data-eco-v9-toggle]');
  const close = event.target.closest('[data-eco-v9-close]');
  if (reset) {
    const page = reset.closest('.eco-v9-page');
    page.querySelectorAll('[data-eco-v9-field]').forEach(field=>{field.value='all';});
    page.querySelector('[data-eco-v9-search]').value='';
    updateV9EcosystemDirectory();
    return;
  }
  if (toggle || close) {
    const card = (toggle||close).closest('[data-eco-v9-card]');
    const opening = !close && !card.classList.contains('is-open');
    document.querySelectorAll('[data-eco-v9-card].is-open').forEach(other=>{
      other.classList.remove('is-open');
      other.classList.add('is-dismissed');
      other.querySelector('[data-eco-v9-toggle]').setAttribute('aria-expanded','false');
    });
    card.classList.toggle('is-open',opening);
    card.classList.toggle('is-dismissed',!opening);
    card.querySelector('[data-eco-v9-toggle]').setAttribute('aria-expanded',String(opening));
    if (close) card.querySelector('[data-eco-v9-toggle]').focus();
    return;
  }
  if (!event.target.closest('.eco-v9-card')) document.querySelectorAll('[data-eco-v9-card].is-open').forEach(card=>{
    card.classList.remove('is-open');
    card.classList.add('is-dismissed');
    card.querySelector('[data-eco-v9-toggle]').setAttribute('aria-expanded','false');
  });
}

function geoRender({focus=true}={}) {
  if (!geoRoot) return;
  const app = document.getElementById('app');
  const blocked = geoBlocked();
  if (blocked && !app.inert && document.activeElement && app.contains(document.activeElement)) geoReturnFocus = document.activeElement;
  app.inert = blocked;
  if (blocked) app.setAttribute('aria-hidden','true'); else app.removeAttribute('aria-hidden');
  document.body.classList.toggle('geo-access-blocked',blocked);
  document.body.dataset.geoStatus = geoState.status;
  geoRoot.innerHTML = geoMarkup();
  const switcher = document.getElementById('language-switch');
  if (switcher) switcher.href = geoLanguageHref();
  if (!focus) return;
  if (blocked) document.getElementById('geo-title')?.focus({preventScroll:true});
  else if (geoReturnFocus?.isConnected) { geoReturnFocus.focus({preventScroll:true}); geoReturnFocus = null; }
  else geoRoot.querySelector('[data-geo-preview="ALLOW"]')?.focus({preventScroll:true});
}

function geoSetPreview(value,{focus=true}={}) {
  if (!geoIsPreview || !['US','ALLOW','UNKNOWN'].includes(value)) return false;
  geoPreviewState = value;
  geoState = value === 'US' ? {status:'restricted',country:'US'} : value === 'UNKNOWN' ? {status:'error',country:null} : {status:'allowed',country:null};
  geoRender({focus});
  return true;
}

async function geoCheck() {
  if (geoIsPreview) { geoSetPreview(geoPreviewState); return; }
  const request = ++geoRequest;
  geoState = {status:'checking',country:null};
  geoRender();
  let timeout;
  try {
    if (geoConfig.mode !== 'server' || typeof geoConfig.endpoint !== 'string' || !geoConfig.endpoint) throw new Error('No region endpoint');
    const endpoint = new URL(geoConfig.endpoint,location.href);
    if (endpoint.origin !== location.origin || endpoint.protocol !== 'https:') throw new Error('Region endpoint must use same-origin HTTPS');
    const controller = new AbortController();
    const duration = Number.isFinite(geoConfig.timeoutMs) ? Math.min(15000,Math.max(1000,geoConfig.timeoutMs)) : 6000;
    const timedOut = new Promise((_,reject) => { timeout = setTimeout(() => { controller.abort(); reject(new Error('Region request timed out')); },duration); });
    const response = await Promise.race([fetch(endpoint.href,{credentials:'same-origin',cache:'no-store',redirect:'error',headers:{Accept:'application/json'},signal:controller.signal}),timedOut]);
    if (!response.ok) throw new Error('Region request failed');
    const data = await Promise.race([response.json(),timedOut]);
    if (request !== geoRequest) return;
    geoState = geoDecision(data?.country);
  } catch (_) {
    if (request !== geoRequest) return;
    geoState = {status:'error',country:null};
  } finally { clearTimeout(timeout); }
  geoRender();
}

function geoKeyboard(event) {
  if (!geoRoot || !geoBlocked()) return;
  if (event.key === 'Escape') { event.preventDefault(); event.stopImmediatePropagation(); return; }
  if (event.key !== 'Tab') return;
  const items = [...geoRoot.querySelectorAll('a[href],button:not([disabled])')].filter(node => node.getClientRects().length);
  if (!items.length) { event.preventDefault(); document.getElementById('geo-title')?.focus(); return; }
  const first = items[0],last = items[items.length - 1];
  if (event.shiftKey && (document.activeElement === first || !items.includes(document.activeElement))) { event.preventDefault(); last.focus(); }
  else if (!event.shiftKey && document.activeElement === last) { event.preventDefault(); first.focus(); }
}

if (geoRoot) {
  document.addEventListener('click',event => {
    if (geoBlocked() && !geoRoot.contains(event.target)) { event.preventDefault(); event.stopImmediatePropagation(); return; }
    const preview = event.target.closest('[data-geo-preview]');
    if (preview && geoRoot.contains(preview)) { event.preventDefault(); geoSetPreview(preview.dataset.geoPreview); }
    if (event.target.closest('[data-geo-retry]')) { event.preventDefault(); geoCheck(); }
  },true);
  document.addEventListener('keydown',geoKeyboard,true);
  document.addEventListener('focusin',event => {
    if (geoBlocked() && !geoRoot.contains(event.target)) document.getElementById('geo-title')?.focus({preventScroll:true});
  },true);
  // The overlay lives outside #app and survives all product/document hash routes.
  window.addEventListener('hashchange',() => { if (geoBlocked()) geoRender({focus:false}); });

  return `<a class="skip" href="#main">${t('跳至內容','Skip to content')}</a>
    <header class="site-header">
      <a class="site-logo" href="#/" aria-label="WAGMIx ${t('首頁','home')}"><img src="${variant === 'adgm' ? LOGO_LIGHT : LOGO}" alt="WAGMIx"></a>
      ${headerSocials()}
      <nav class="site-nav" id="site-nav" aria-label="${t('網站選單','Site navigation')}">
        <a data-top-key="home" href="#/" class="${page === 'home' ? 'active' : ''}" ${page === 'home' ? 'aria-current="page"' : ''}>${t('關於 WAGMIx','About WAGMIx')}</a>
        <details class="product-menu"><summary data-top-key="products" class="${inProduct ? 'active' : ''}">${t('產品','Products')} <span aria-hidden="true">⌄</span></summary>
          <div class="product-menu-panel">
            <a class="menu-category" href="#/products">
              <span class="menu-category-title">${t('代幣化股票／ETF','Tokenized Stocks / ETFs')}<span aria-hidden="true">↗</span></span>
              <span class="menu-underlying-code">${t('底層資產：港交所 · ','Underlying asset: HKEX · ')}<b>7709.HK</b></span>
              <span class="menu-underlying-name">${t('南方東英 SK 海力士每日槓桿最多（2x）產品','CSOP SK Hynix Daily Max (2x) Leveraged Product')}</span>
            </a>
          </div>
        </details>
        <a data-top-key="ecosystem" href="#/ecosystem" class="${page === 'ecosystem' ? 'active' : ''}" ${page === 'ecosystem' ? 'aria-current="page"' : ''}>${t('生態','Ecosystem')}</a>
        <a class="mobile-contact" data-top-key="contact-mobile" href="#/home/contact">${t('聯絡我們','Contact us')}</a>
      </nav>
      <div class="header-actions"><a class="header-contact btn" data-top-key="contact" href="#/home/contact">${t('聯絡我們','Contact us')} <span aria-hidden="true">↗</span></a><a id="language-switch" class="lang-switch" lang="${L === 'zh' ? 'en' : 'zh-Hant'}" href="${geoLanguageHref()}">${t('EN','繁中')}</a><button class="mobile-toggle" aria-label="${t('網站選單','Site menu')}" aria-controls="site-nav" aria-expanded="false"><span aria-hidden="true">☰</span></button></div>
    </header>`;
}

function contextNav(kind,variant='bvi') {
  let title = '', subtitle = '', links = '', meta = '';
  if (kind === 'capabilities') {
    title = t('五項核心能力','Our capabilities');
    subtitle = t('點選定位，或向下閱讀','Jump to a capability or keep reading');
    links = CAPABILITIES.map((capability,index) => sideLink('#/home/capabilities/' + index,`<small>0${index + 1}</small>${esc(pick(capability.title))}`,'cap-' + index,`id="cap-tab-${index}" data-cap="${index}"`)).join('');
  } else if (kind === 'product') {
    title = productCode(variant);
    links = productSections.map(([key,zh,en],index) => sideLink('#/products/7709/' + title + '/' + key,`<small>0${index + 1}</small>${t(zh,en)}`,'product-' + key)).join('');
  } else {
    title = t('產品文件','Product documents');
    subtitle = 'SKHY2Lw';
    links = sideLink('#/docs',t('文件總覽','Document overview'),'docs') + WHITEPAPER.map((chapter,index) => sideLink('#/whitepaper/' + chapter.id,`<small>${shortRefs[index]}</small>${esc(chapterNames[chapter.id])}`,'wp-' + chapter.id)).join('');
    meta = `<a class="context-version-link" href="#/products/7709/SKHY2Lw/documents">← ${t('返回 SKHY2Lw','Back to SKHY2Lw')}</a>`;
  }
  const toggle = kind === 'capabilities' ? '' : `<button class="context-toggle" type="button" aria-expanded="false" aria-controls="${kind}-toc"><span>${kind === 'product' ? title : t('本頁目錄','On this page')}<b data-context-current></b></span><i aria-hidden="true">⌄</i></button>`;
  return `<aside class="context-nav" data-context="${kind}" aria-label="${title}"><div class="context-heading">${subtitle ? '<small>' + subtitle + '</small>' : ''}<strong>${title}</strong>${meta}</div>${toggle}<nav class="context-links" id="${kind}-toc" aria-label="${title}">${links}</nav></aside>`;
}

function capabilityNav() { return contextNav('capabilities'); }

function pageBody(page,chapter,variant) {
  if (page === 'home') return home();
  if (page === 'catalog') return catalog();
  if (page === 'ecosystem') return ecosystem();
  if (page === 'docs') return docsHome();
  const isProduct = page === 'product' || page === 'adgmguide';
  const kind = isProduct ? 'product' : 'whitepaper';
  const content = page === 'product' ? (variant === 'adgm' ? adgmProduct() : product()) : page === 'adgmguide' ? adgmGuide() : whitepaper(chapter);
  return `<div class="context-layout ${kind}-layout ${variant === 'adgm' ? 'adgm-layout' : ''}">${contextNav(kind,variant)}<div class="context-content">${content}</div></div>`;
}

function setActiveNav(key) {
  const changed = lastNavKey !== key;
  lastNavKey = key;
  document.querySelectorAll('[data-nav-key]').forEach(link => {
    const active = link.dataset.navKey === key;
    link.classList.toggle('active',active);
    if (active) link.setAttribute('aria-current','location');
    else link.removeAttribute('aria-current');
  });
  const active = document.querySelector('[data-nav-key][aria-current="location"]');
  if (!active) return;
  const nav = active.closest('.context-nav');
  const current = nav?.querySelector('[data-context-current]');
  if (current) current.textContent = [...active.querySelector('span').childNodes].filter(node => node.nodeName !== 'SMALL').map(node => node.textContent).join('').trim();
  if (changed && innerWidth > 900) requestAnimationFrame(() => {
    const box = nav.getBoundingClientRect(), item = active.getBoundingClientRect();
    if (item.top < box.top || item.bottom > box.bottom) nav.scrollTop += item.top - box.top - 55;
  });
}
function selectCapability(index) {
  activeCapability = Math.max(0,Math.min(4,Number(index) || 0));
  setActiveNav('cap-' + activeCapability);
}
function capabilityOffset() {
  const nav = document.querySelector('[data-context="capabilities"]');
  return innerWidth <= 900 && nav ? 88 + nav.getBoundingClientRect().height + 18 : 120;
}
function scrollToCapability(target) {
  window.scrollTo({top:Math.max(0,window.scrollY + target.getBoundingClientRect().top - capabilityOffset()),behavior:'instant'});
}
function closeContext() {
  document.querySelectorAll('.context-nav.is-open').forEach(nav => {
    nav.classList.remove('is-open');
    nav.querySelector('.context-toggle').setAttribute('aria-expanded','false');
  });
}
function closeNavigation(returnFocus=false) {
  const productOpen = document.querySelector('.product-menu[open]');
  const topOpen = document.querySelector('.site-nav')?.classList.contains('open');
  const contextOpen = document.querySelector('.context-nav.is-open');
  document.querySelector('.site-nav')?.classList.remove('open');
  document.querySelector('.mobile-toggle')?.setAttribute('aria-expanded','false');
  document.querySelectorAll('.product-menu[open]').forEach(menu => menu.removeAttribute('open'));
  closeContext();
  if (!returnFocus) return;
  if (contextOpen) contextOpen.querySelector('.context-toggle').focus();
  else if (topOpen) document.querySelector('.mobile-toggle').focus();
  else if (productOpen) productOpen.querySelector('summary').focus();
}

function route() {
  const fromMenu = Boolean(document.querySelector('.site-nav.open,.context-nav.is-open'));
  const parts = location.hash.replace(/^#\/?/,'').split('/');
  if (parts[0] === 'home' && parts[1] === 'whitepaper') {
    location.replace('#/products/7709/SKHY2Lw/documents');
    return;
  }
  let page = 'home', variant = '', section = '', chapter = '';
  if (parts[0] === 'products') {
    page = parts[1] === '7709' ? 'product' : 'catalog';
    if (page === 'product') {
      const productKey = (parts[2] || '').toLowerCase();
      variant = ['7709.w','adgm'].includes(productKey) ? 'adgm' : 'bvi';
      const hasProduct = ['7709.w','skhy2lw','adgm','bvi'].includes(productKey);
      section = (hasProduct ? parts[3] : parts[2]) || 'overview';
      if (section === 'whitepaper') section = 'documents';
      if (section === 'mechanics') section = 'terms';
      if (variant === 'adgm' && section === 'guide') page = 'adgmguide';
      if (!productSections.some(entry => entry[0] === section) && page === 'product') section = 'overview';
      const canonicalHash = '#/products/7709/' + productCode(variant) + '/' + section;
      if (location.hash !== canonicalHash) {
        location.replace(canonicalHash);
        return;
      }
    }
  } else if (parts[0] === 'whitepaper') {
    page = 'whitepaper'; variant = 'bvi'; chapter = parts[1] || 'summary';
  } else if (parts[0] === 'docs') {
    page = 'docs'; variant = 'bvi';
  } else if (parts[0] === 'ecosystem') page = 'ecosystem';
  const changed = page !== lastRoute.page || chapter !== lastRoute.chapter || variant !== lastRoute.variant;
  document.body.dataset.page = page;
  document.body.dataset.variant = variant;
  document.body.classList.toggle('en',L === 'en');
  if (changed) {
    lastNavKey = '';
    document.getElementById('app').innerHTML = header(page,variant) + pageBody(page,chapter,variant) + footer(page,variant);
    const title = page === 'home' ? 'WAGMIx' : page === 'catalog' ? t('代幣化股票／ETF | WAGMIx','Tokenized Stocks / ETFs | WAGMIx') : page === 'product' || page === 'adgmguide' ? productCode(variant) + ' | WAGMIx' : page === 'ecosystem' ? t('生態 | WAGMIx','Ecosystem | WAGMIx') : page === 'docs' ? t('SKHY2Lw 產品文件 | WAGMIx','SKHY2Lw Product Documents | WAGMIx') : (chapterNames[chapter] || t('產品文件','Product documents')) + ' | WAGMIx';
    document.title = title + t('｜繁體中文',' | English');
  }
  lastRoute = {page,chapter,variant};
  document.getElementById('language-switch').href = geoLanguageHref();
  closeNavigation();
  if (page === 'home') selectCapability(parts[1] === 'capabilities' ? parts[2] || 0 : activeCapability);
  setActiveNav(page === 'product' ? 'product-' + section : page === 'adgmguide' ? 'product-documents' : page === 'whitepaper' ? 'wp-' + chapter : page === 'docs' ? 'docs' : 'cap-' + activeCapability);
  const capabilityRoute = page === 'home' && parts[1] === 'capabilities' && parts[2] !== undefined;
  const ids = variant === 'adgm' ? adgmSectionIds : bviSectionIds;
  const anchor = page === 'home' ? (capabilityRoute ? 'capability-' + activeCapability : parts[1]) : page === 'product' ? ids[section] : page === 'ecosystem' && parts[1] === 'directory' ? 'ecosystem-directory' : page === 'whitepaper' && parts[2] ? 'wp-' + parts[2] : null;
  requestAnimationFrame(() => {
    const target = (anchor && document.getElementById(anchor)) || document.getElementById('main');
    if (!target) return;
    if (fromMenu) { target.setAttribute('tabindex','-1'); target.focus({preventScroll:true}); }
    if (capabilityRoute) scrollToCapability(target);
    else if (anchor && document.getElementById(anchor)) target.scrollIntoView({behavior:'instant',block:'start'});
    else window.scrollTo({top:0,behavior:'instant'});
  });
}
function scrollSpy() {
  if (spyPending) return;
  spyPending = true;
  requestAnimationFrame(() => {
    spyPending = false;
    const page = document.body.dataset.page;
    if (page === 'home') {
      let active = 0;
      const cut = capabilityOffset() + 40;
      document.querySelectorAll('[data-capability]').forEach((element,index) => { if (element.getBoundingClientRect().top <= cut) active = index; });
      selectCapability(active);
      return;
    }
    if (page !== 'product') return;
    const ids = document.body.dataset.variant === 'adgm' ? adgmSectionIds : bviSectionIds;
    const cut = innerWidth <= 900 ? 200 : 150;
    let key = 'product-overview';
    for (const [section,id] of Object.entries(ids)) {
      const element = document.getElementById(id);
      if (element && element.getBoundingClientRect().top <= cut) key = 'product-' + section;
    }
    setActiveNav(key);
  });
}
function trapTopMenu(event) {
  if (event.key !== 'Tab' || !document.querySelector('.site-nav.open')) return;
  const items = [...document.querySelectorAll('.site-header a,.site-header button,.site-header summary')].filter(node => node.getClientRects().length);
  const first = items[0], last = items.at(-1);
  if (event.shiftKey && document.activeElement === first) { event.preventDefault(); last.focus(); }
  else if (!event.shiftKey && document.activeElement === last) { event.preventDefault(); first.focus(); }
}

document.addEventListener('click',event => {
  handleEcosystemClick(event); handleDocsClick(event);
  const menu = event.target.closest('.mobile-toggle');
  if (menu) {
    const open = !document.querySelector('.site-nav').classList.contains('open');
    closeNavigation(); document.querySelector('.site-nav').classList.toggle('open',open);
    menu.setAttribute('aria-expanded',String(open));
    if (open) document.querySelector('.site-nav a').focus();
    return;
  }
  const toggle = event.target.closest('.context-toggle');
  if (toggle) {
    const nav = toggle.closest('.context-nav'), open = !nav.classList.contains('is-open');
    closeNavigation(); nav.classList.toggle('is-open',open); toggle.setAttribute('aria-expanded',String(open)); return;
  }
  if (!event.target.closest('.site-header,.context-nav')) closeNavigation();
  if (event.target.closest('.skip')) {
    event.preventDefault(); const main = document.getElementById('main'); main.setAttribute('tabindex','-1'); main.focus(); main.scrollIntoView(); return;
  }
  if (event.target.closest('.back-top')) window.scrollTo({top:0,behavior:'smooth'});
  const chart = event.target.closest('[data-chart]');
  if (chart) {
    document.querySelectorAll('[data-chart]').forEach(button => { button.classList.toggle('selected',button === chart); button.setAttribute('aria-pressed',String(button === chart)); });
    document.getElementById('price-chart').innerHTML = priceChart(chart.dataset.chart);
  }
  const link = event.target.closest('a[href^="#/"]');
  if (link && link.getAttribute('href') === location.hash) { event.preventDefault(); route(); }
});
document.addEventListener('input',event => { handleDocsInput(event); handleEcosystemInput(event); });
document.addEventListener('keydown',event => { handleDocsKeydown(event); if (event.key === 'Escape') closeNavigation(true); trapTopMenu(event); });
window.addEventListener('scroll',scrollSpy,{passive:true});
window.addEventListener('resize',() => {
  scrollSpy();
  if (innerWidth > 900) {
    const open = document.querySelector('.site-nav.open,.context-nav.is-open'); closeNavigation();
    if (open) document.querySelector('.site-logo').focus();
  }
});
window.addEventListener('hashchange',route);
route();
</script></body></html>
